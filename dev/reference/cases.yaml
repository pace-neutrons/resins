# Static case configuration for the reference data generators.

# Two-tier structure (design D4):
#   grid       instrument-level base grid: a coarse Cartesian product of incident
#              energies and chopper frequencies, inherited by all configurations.
#   ei_range   incident energy bounds, for limit points just inside/outside.
#   defaults   default settings, used for the single-frequency / single-Ei limit cases.
#   configurations  per-chopper-package edge pairs and optional grid overrides.
#
# The generator expands each configuration's cases as:
#   regular = grid.e_init x grid.<frequency> (or the config grid override)
#   + edges (per-frequency Ei pairs straddling zero-transmission edges)
#   + limit points (Ei just inside/outside ei_range, at the default frequency;
#      frequencies just above max and off the grid, at the default Ei)
#
# Outcomes (value / no_transmission / rejected_ei / rejected_frequency) are
# assigned by the generator from PyChop; they are not stored here.
#
# This file was derived from the reference data generated by the previous runtime
# sampling approach. To regenerate after changing it, run `pixi run update`.

