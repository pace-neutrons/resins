name: "Lagrange"
default_version: 'Lagrange'


version:
    Lagrange:
        constants: &lagrange_constants
            final_neutron_energy: 4.5 * 8.06554465  # Final energy on the crystal analyser in cm-1 (converted from eV)
            scattering_angle_range: [10, 90]
            angles_per_detector: 5
            energy_bin_width: 1.0  # Default bin width in wavenumber
        default_model: "AbINS"
        # Resins stores widths as sigma (meV), so a factor of 0.5 is applied to the 2*sigma
        # parameters of Abins `parameters.py` (`fit`, minimum and low-energy resolution) here,
        # for both AbINS_v1 and AbINS_v2.
        models:
            AbINS: "AbINS_v2"
            AbINS_v1:
                # Superseded by AbINS_v2
                # AbINS_v1 does not match any released Mantid/Abins implementation exactly.
                # It applies a 25 meV low-energy cutoff for Cu(220), whereas:
                #
                #   - Mantid <= 6.14 applies this method in the wrong units, so the flat segment
                #     applies below about 3.1 meV;
                #   - Mantid >= 6.15 (mantidproject/mantid#40229) replaces the energy cutoff with a
                #     resolution floor, as implemented in AbINS_v2.
                function: "discontinuous_polynomial"
                citation: ["Mantid (2013): Manipulation and Analysis Toolkit for Instrument Data.; Mantid Project. http://dx.doi.org/10.5286/SOFTWARE/MANTID6.10"]
                parameters:
                    defaults: {}
                    restrictions: {}
                configurations:
                    monochromator:
                        default_option: "Cu(220)"
                        Cu(220):
                            #ei_range: [26, 500]  # meV
                            fit: [-1.79805e-2, 1.078e-2, 3.84935e-5, ]  # meV
                            low_energy_cutoff: 25  # meV
                            low_energy_resolution: 0.4  # meV
                        Cu(331):
                            #ei_range: [67, 500]  # meV
                            fit: [3.29181059e-01, 2.57962693e-04, 5.59555475e-05, -4.302557985e-08]  # meV
                        Si(311):
                            #ei_range: [16.5, 60]  # meV
                            fit: [0.4]  # meV
                        Si(111):
                            #ei_range: [4.5, 20]  # meV
                            fit: [0.4]  # meV
            AbINS_v2:
                function: "floored_polynomial"
                citation:
                    - "Mantid (2013): Manipulation and Analysis Toolkit for Instrument Data.; Mantid Project. http://dx.doi.org/10.5286/SOFTWARE/MANTID6.15"
                    - "Mantid pull request mantidproject/mantid#40229 (Abins Lagrange resolution floor). https://github.com/mantidproject/mantid/pull/40229"
                parameters:
                    defaults: {}
                    restrictions: {}
                configurations:
                    monochromator:
                        default_option: "Cu(220)"
                        Cu(220):
                            #ei_range: [26, 500]  # meV
                            fit: [-1.79805e-2, 1.078e-2, 3.84935e-5, ]  # meV
                            minimum_sigma: 0.4  # meV; Abins minimum_resolution_meV (0.8 as 2*sigma)
                        Cu(331):
                            #ei_range: [67, 500]  # meV
                            fit: [3.29181059e-01, 2.57962693e-04, 5.59555475e-05, -4.302557985e-08]  # meV
                            minimum_sigma: 0.0  # meV; no floor
                        Si(311):
                            #ei_range: [16.5, 60]  # meV
                            fit: [0.4]  # meV
                            minimum_sigma: 0.0  # meV; no floor
                        Si(111):
                            #ei_range: [4.5, 20]  # meV
                            fit: [0.4]  # meV
                            minimum_sigma: 0.0  # meV; no floor
